<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../assets/styles/styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Ejercicio 2</h1>
      <p>
        Declara un array de 100 números. Rellena el array con valores al azar.
        Muestra el contenido console.table. Realiza un filtrado de datos. Por
        ejemplo mostrando los valores de un determinado rango
      </p>
      <div id="resultado"></div>
    </div>
  </body>
  <script>
    for (let i = 0; i < 100; i++) {
      const numero = Math.floor(Math.random() * 100) + 1;
      console.table({ index: i, value: numero });
    }
  </script>
</html>
