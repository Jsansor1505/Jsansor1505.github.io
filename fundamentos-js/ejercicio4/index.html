<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../assets/styles/styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Ejercicio 4</h1>
      <p>
        Escribe un programa que pida al usuario ingresar dos números y luego
        muestre la suma. Usa prompt() para pedir datos al usuario y Number()
        para convertir las entradas a números. Usa console.log() para mostrar el
        resultado
      </p>
      <div id="resultado"></div>
    </div>
  </body>
  <script>
    const num1 = Number(prompt("Ingresa el primer número:"));
    const num2 = Number(prompt("Ingresa el segundo número:"));
    const suma = num1 + num2;
    console.log("La suma es:", suma);
    document.getElementById("resultado").innerHTML = "La suma es: " + suma;
  </script>
</html>
