<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../assets/styles/styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Ejercicio 20</h1>
      <p>
        Convertir una cadena a mayúsculas y minúsculas Escribe una función que
        convierta una cadena de texto a mayúsculas y luego a minúsculas,
        mostrando ambos resultados. Usa los métodos toUpperCase() y
        toLowerCase().
      </p>
      <input type="text" id="frase" placeholder="Ingresa una frase" />
      <button onclick="convertir()">Verificar</button>
      <div id="resultado"></div>
    </div>
  </body>
  <script>
    function convertir(){
      const frase = document.getElementById("frase").value;
      const mayusculas = frase.toUpperCase();
      const minusculas = frase.toLowerCase();
      document.getElementById("resultado").innerHTML = "Mayúsculas: " + mayusculas + "<br>Minúsculas: " + minusculas;
    }
  </script>
</html>
