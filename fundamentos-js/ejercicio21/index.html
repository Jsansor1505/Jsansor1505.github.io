<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../assets/styles/styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Ejercicio 21</h1>
      <p>
        Filtrar números mayores que un valor. Escribe una función que tome un
        array de números y un valor, y devuelva un nuevo array con los números
        que son mayores que ese valor. Usa filter() para crear el nuevo array.
      </p>
      <input type="text" id="numeros" placeholder="Ingresa números separados por comas"/>
      <input type="text" id="valor" placeholder="Ingresa el valor de referencia"/>
      <button onclick="filtrar()">Filtrar</button>
      <div id="resultado"></div>
    </div>
  </body>
  <script>
    function filtrar() {
      const numeros = document.getElementById("numeros").value.split(",").map(Number);
      const valor = parseFloat(document.getElementById("valor").value);
      <!--Use la IA para averiguar que hace filter-->
      const numerosFiltrados = numeros.filter(num => num > valor);
      document.getElementById("resultado").innerHTML = "Números mayores que " + valor + ": " + numerosFiltrados.join(", ");
    }
  </script>
</html>
