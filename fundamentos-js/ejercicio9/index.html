<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../assets/styles/styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Ejercicio 9</h1>
      <p>
        Escribe una función que tome una cadena como argumento y devuelva la
        cadena invertida. Usa el método split() para convertir la cadena en un
        arreglo, reverse() para invertir el arreglo, y join() para unirlo de
        nuevo.
      </p>
      <input type="text" id="palabra" placeholder="Ingresa una palabra" />
      <button onclick="invertir()">Verificar</button>
      <div id="resultado"></div>
    </div>
  </body>
  <script>
    function invertir() {
      const palabra = document.getElementById("palabra").value;
      const invertida = palabra.split("").reverse().join("");
      document.getElementById("resultado").innerHTML = invertida;
    }
  </script>
</html>
