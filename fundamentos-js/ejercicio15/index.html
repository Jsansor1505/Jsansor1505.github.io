<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../assets/styles/styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Ejercicio 15</h1>
      <p>
        Encontrar los números primos en un rango Escribe un programa que imprima
        todos los números primos entre 1 y un número dado por el usuario. Crea
        un función llamada esPrimo(num) que reciba num, un número entero
      </p>
      <input type="number" id="numero" placeholder="Ingresa un número" />
      <button onclick="encontrarPrimos()">Verificar</button>
      <div id="resultado"></div>
    </div>
  </body>
  <script>
    const numMax = document.getElementById("numero");
    function esPrimo(num) {
      if (num < 2) return false;
      for (let i = 2; i <= Math.sqrt(num); i++) {
        if (num % i === 0) return false;
      }
      return true;
    }
    function encontrarPrimos(){
      let primos = [];
      for (let i = 2; i <= numMax.value; i++) {
        if (esPrimo(i)) {
          primos.push(i);
        }
      }
      document.getElementById("resultado").innerHTML = "Números primos: " + primos.join(", ");
    }
    document.getElementById("resultado").innerHTML = "";
  </script>
</html>
