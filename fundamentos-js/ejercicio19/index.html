<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../assets/styles/styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Ejercicio 19</h1>
      <p>
        Calcular el promedio de un array de números. Escribe una función que
        reciba un array de números y calcule su promedio. Usa reduce() para
        sumar todos los números y luego divide entre la longitud del array.
      </p>
      <input
        type="text"
        id="numeros"
        placeholder="Ingresa números separados por comas"
      />
      <button onclick="promedio()">Ordenar</button>
      <div id="resultado"></div>
    </div>
  </body>
  <script>
    function promedio() {
      const numeros = document.getElementById("numeros").value.split(",");
      let suma = 0;
      for (let i = 0; i < numeros.length; i++) {
        suma += parseFloat(numeros[i]);
      }
      const promedio = suma / numeros.length;
      document.getElementById("resultado").innerHTML =
        "El promedio es: " + promedio;
    }
  </script>
</html>
